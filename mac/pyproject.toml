[project]
name = "keyguard"
version = "0.1.0"
license = "MIT"
description = "Local macOS secret manager that gates every decryption behind Touch ID"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    # pytest 9.0.3 fixes its temporary-folder flaw and needs Python 3.10. CI's 3.9 job adds 8.4.2 itself.
    "pytest>=9.0.3; python_version >= '3.10'",
]
