name: Passkey

# A change under mac/ alone runs mac.yml only. A push to main here builds the unlock service's image, which Flux rolls
# out, so a Mac commit must not start it. Path filters do not apply to tag pushes: a release tag always runs.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths-ignore: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: uv sync --locked
      - run: uv run --locked pytest -v

  browser:
    runs-on: ubuntu-latest
    env:
      KEYGUARD_PASSKEY_E2E: required
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: uv run --locked --with playwright==1.63.0 playwright install --with-deps chromium-headless-shell
      - run: uv run --locked --with playwright==1.63.0 pytest tests/test_end_to_end.py tests/test_end_to_end_service.py -v

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: tools/typage/.bun-version
      - run: python3 tools/build_typage.py --check
      - run: bun test ./tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, browser, pages, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pack the client at the tag
        run: python3 tools/vendor.py --pyz "$GITHUB_REF_NAME" "$RUNNER_TEMP"
      - name: Publish the release with the packed client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/keyguard-passkey.pyz" | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/keyguard-passkey.pyz" --verify-tag \
            --title "keyguard-passkey ${GITHUB_REF_NAME#v}" \
            --notes "keyguard-passkey.pyz SHA-256: $sha. \`python3 tools/vendor.py --pyz $GITHUB_REF_NAME DIR\` packs the same bytes from the tag."

  image:
    needs: [lint, test, browser, pages, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: keyguard-passkey:test
      - name: Serve from the image
        run: |
          docker run -d --name served keyguard-passkey:test
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' served)" = healthy ] && break
            sleep 1
          done
          docker logs served
          [ "$(docker inspect -f '{{.State.Health.Status}}' served)" = healthy ]
      - name: Write a new store volume as the image's user
        run: docker run --rm -v store:/store --entrypoint touch keyguard-passkey:test /store/written
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/emazzotta/keyguard-passkey
          flavor: latest=false
          tags: |
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
