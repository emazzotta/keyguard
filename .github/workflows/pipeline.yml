name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner image ships Swift. swift-actions/setup-swift cannot install
      # on Ubuntu 26.04 (swift-actions/setup-swift#798, #805).
      - run: swift --version
      # Without age the store round-trip test skips itself rather than failing,
      # which would quietly remove the only end-to-end coverage there is.
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: make test-swift
      - run: make test-cli

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # launchd runs the server on macOS's /usr/bin/python3, which is 3.9.
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: make test-python
