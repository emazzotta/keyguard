name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      # Without age the store round-trip test skips itself rather than failing,
      # which would quietly remove the only end-to-end coverage there is.
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: make test-swift
      - run: make test-cli

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: make test-python
